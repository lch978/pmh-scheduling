# cloudbuild.yaml

#–– your own substitutions ––
substitutions:
  _SERVICE_NAME: "pmh-scheduler"   # the Cloud Run service name
  _REGION:       "us-central1"     # change if you want a different region

#–– force Cloud Build to send logs only to Cloud Logging ––
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t", "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA",
        "-f", "surgeon_scheduler_mvp/Dockerfile",
        "."
      ]

  # 2) Push it to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA"
      ]

  # 3) Deploy to Cloud Run (managed)
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "${_SERVICE_NAME}",
        "--image", "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA",
        "--region", "${_REGION}",
        "--platform", "managed",
        "--allow-unauthenticated"
      ]

#–– let Cloud Build know which image(s) you’re producing ––
images:
  - "gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$SHORT_SHA"
