# cloudbuild.yaml

# 1) Logging options go under options
options:
  logging: CLOUD_LOGGING_ONLY

# 2) Timeout is a top‐level field, not under options
timeout: "1200s"

substitutions:
    # <-- your Cloud Run region
  _SERVICE: pmh-scheduling  # <-- your Cloud Run service name

steps:
  # Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t", "gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA",
        "."
      ]

  # Push it
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA"
      ]

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run", "deploy", "${_SERVICE}",
        "--image", "gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA",
        "--region", "${_REGION}",
        "--platform", "managed",
        "--quiet",
        "--allow-unauthenticated"
      ]

images:
  - "gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA"
