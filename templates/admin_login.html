{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block head %}
<style>
  .login-card { max-width: 420px; margin: 60px auto; }
  .login-card h2 { margin-bottom: 14px; }
  .login-card .login-intro { margin-bottom: 16px; }
  .login-card label { display: block; margin-bottom: 6px; font-weight: 600; }
  .login-card .form-control { width: 100%; margin-bottom: 12px; }
  .login-card .btn { width: 100%; margin-top: 4px; }
</style>
{% endblock %}
{% block content %}
<div class="card login-card">
  <h2>Admin Login</h2>
  <p class="login-intro subtle">Enter admin credentials to unlock the navigation tabs.</p>
  <form method="post" action="{{ url_for('admin_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">Username</label>
    <input class="form-control" id="username" name="username" type="text" autocomplete="username" required>

    <label for="password">Password</label>
    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary">Sign In</button>
  </form>
</div>
{% endblock %}
