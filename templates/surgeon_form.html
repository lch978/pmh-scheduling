{% extends 'base.html' %}

{% block title %}{{ action }} Surgeon {% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-lg mt-10">
  <h1 class="text-3xl font-bold text-center mb-8">{{ action }} Surgeon</h1>
  <form method="post" class="space-y-8">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <!-- Name Field -->
    <div>
      <label for="name" class="block text-xl font-semibold mb-3">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        value="{{ surgeon.name or '' }}"
        required
        class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>
    <!-- Call Levels -->
    <div>
      <span class="block text-xl font-semibold mb-3">Call Levels</span>
      <div class="grid grid-cols-3 gap-4">
        {% for lvl in ['1A','1B','2A','2B','3','4'] %}
          <label class="flex items-center space-x-2">
            <input
              type="checkbox"
              name="call_levels"
              value="{{ lvl }}"
              class="h-5 w-5 text-indigo-600 border-gray-300 rounded"
              {% if lvl in surgeon.call_levels.split(',') %}checked{% endif %}
            />
            <span class="text-lg">{{ lvl }}</span>
          </label>
        {% endfor %}
      </div>
    </div>
    <!-- Team Selection -->
    <div>
      <label for="team" class="block text-xl font-semibold mb-3">Team</label>
      <select id="team" name="team" class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="" {% if not surgeon.team %}selected{% endif %}>&mdash; None &mdash;</option>
        <option value="Team 1" {% if surgeon.team == 'Team 1' %}selected{% endif %}>Team 1</option>
        <option value="Team 2" {% if surgeon.team == 'Team 2' %}selected{% endif %}>Team 2</option>
        <option value="Team 3" {% if surgeon.team == 'Team 3' %}selected{% endif %}>Team 3</option>
        <option value="Team 4" {% if surgeon.team == 'Team 4' %}selected{% endif %}>Team 4</option>
        <option value="Urology" {% if surgeon.team == 'Urology' %}selected{% endif %}>Urology</option>
      </select>
    </div>
    <!-- Action Buttons -->
    <div class="flex justify-between">
      <button type="submit" class="px-8 py-3 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 transition-colors">
        {{ action }} Surgeon
      </button>
      <a href="{{ url_for('list_surgeons') }}" class="px-8 py-3 bg-gray-300 text-gray-800 font-semibold rounded-md hover:bg-gray-400 transition-colors">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
